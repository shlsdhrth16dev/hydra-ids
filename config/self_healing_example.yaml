# Self-Healing System Configuration
#
# This is an example configuration file showing all available options.
# Copy this to 'config.yaml' and customize for your environment.

# Health Monitor Configuration
health_monitor:
  recall_threshold: 0.85
  accuracy_threshold: 0.90
  precision_threshold: 0.85
  f1_threshold: 0.85
  enable_trend_tracking: true
  trend_window_size: 10
  degradation_threshold: 0.05
  enable_adaptive_thresholds: true
  adaptation_rate: 0.1

# Drift Detector Configuration
drift_detector:
  ks_p_value_threshold: 0.05
  psi_threshold: 0.2
  wasserstein_threshold: 0.3
  drift_ratio_threshold: 0.2
  enable_ensemble: true
  min_tests_agree: 2
  enable_feature_importance_weighting: true
  methods:
    - ks
    - psi
    - wasserstein

# Decision Engine Configuration
decision_engine:
  critical_health_threshold: 0.75
  warning_health_threshold: 0.85
  critical_drift_threshold: 0.3
  warning_drift_threshold: 0.2
  enable_rate_limiting: true
  max_retrains_per_day: 3
  cooldown_hours: 6.0
  min_confidence_for_action: 0.7
  policy: balanced  # Options: conservative, balanced, aggressive

# Retrainer Configuration
retrainer:
  enable_incremental_learning: false
  enable_warm_start: true
  model_type: random_forest  # Options: random_forest, xgboost, sgd
  n_estimators: 200
  max_depth: null
  enable_hyperparameter_tuning: false
  tuning_trials: 50
  tuning_timeout_seconds: 600
  min_training_samples: 1000
  max_class_imbalance_ratio: 100.0
  handle_class_imbalance: true
  imbalance_strategy: class_weight  # Options: class_weight, smote, downsample

# Rollback Configuration
rollback:
  max_versions_to_keep: 10
  auto_cleanup_old_versions: true
  validate_after_rollback: true
  validation_sample_size: 1000
  use_mlflow_registry: false
  mlflow_tracking_uri: null

# Alert System Configuration
alert_system:
  enable_slack: false
  enable_email: false
  enable_webhook: false
  slack_webhook_url: null
  slack_channel: null
  email_recipients: []
  email_from: null
  smtp_server: null
  webhook_url: null
  min_severity_level: WARNING  # Options: INFO, WARNING, CRITICAL
  enable_deduplication: true
  dedup_window_minutes: 30

# Orchestrator Configuration
orchestrator:
  enable_async_operations: false
  enable_dry_run: false
  enable_scheduled_healing: true
  healing_interval_hours: 24.0
  max_concurrent_healings: 1
  enable_distributed_locks: false
  lock_timeout_seconds: 300
  enable_circuit_breaker: true
  failure_threshold: 5
  recovery_timeout_seconds: 60

# Global Settings
log_level: INFO  # Options: DEBUG, INFO, WARNING, ERROR
log_file: null
models_dir: models/baseline
data_dir: data/processed
metrics_dir: metrics/self_healing
